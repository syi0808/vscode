[package]
name = "code-tauri"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
mime_guess = "2"
percent-encoding = "2"
url = "2"
notify = "8.2.0"
globset = "0.4.18"
futures-util = "0.3.32"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "sync", "time"] }
tokio-tungstenite = "0.30.0"
uuid = { version = "1.24.0", features = ["v4"] }
